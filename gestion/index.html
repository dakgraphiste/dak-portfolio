<style>
:root {
  --bg: #F4F4F2; --bg-2: #EBEBE8; --card: #FFFFFF; --fg: #0C0C0E; --muted: #5E5E64; --line: rgba(0,0,0,.10); --line-2: rgba(0,0,0,.16);
  --accent: #FF5A1F; --accent-soft: rgba(255,90,31,.12); --accent-text: #C2410C; --on-accent: #0A0A0A;
  --ok: #15803D; --ok-soft: rgba(21,128,61,.12); --warn: #B45309; --warn-soft: rgba(180,83,9,.13);
  --bad: #C0262D; --bad-soft: rgba(192,38,45,.11); --info: #1D5FD1; --info-soft: rgba(29,95,209,.11);
  --inc: #FF5A1F; --sal: #3B6FE0; --exp: #8B8B93;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
  --radius: 16px; --ease: cubic-bezier(.2,.8,.2,1);
  --font-display: 'Syne', system-ui, sans-serif; --font-body: 'Inter', system-ui, sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0C0C0E; --bg-2: #141417; --card: #17171B; --fg: #F4F4F2; --muted: #A2A2A9; --line: rgba(255,255,255,.09); --line-2: rgba(255,255,255,.16);
  --accent-soft: rgba(255,90,31,.16); --accent-text: #FF7A3D;
  --ok: #4ADE80; --ok-soft: rgba(74,222,128,.13); --warn: #FBBF24; --warn-soft: rgba(251,191,36,.13);
  --bad: #F87171; --bad-soft: rgba(248,113,113,.14); --info: #7AA7FF; --info-soft: rgba(122,167,255,.14);
  --sal: #7AA7FF; --exp: #5C5C66;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0C0C0E; --bg-2: #141417; --card: #17171B; --fg: #F4F4F2; --muted: #A2A2A9; --line: rgba(255,255,255,.09); --line-2: rgba(255,255,255,.16);
  --accent-soft: rgba(255,90,31,.16); --accent-text: #FF7A3D;
  --ok: #4ADE80; --ok-soft: rgba(74,222,128,.13); --warn: #FBBF24; --warn-soft: rgba(251,191,36,.13);
  --bad: #F87171; --bad-soft: rgba(248,113,113,.14); --info: #7AA7FF; --info-soft: rgba(122,167,255,.14);
  --sal: #7AA7FF; --exp: #5C5C66;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
} }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; transition: background-color .3s, color .3s; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
::selection { background: var(--accent); color: #0A0A0A; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- layout ---------- */
.app { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; padding: 20px 14px; border-right: 1px solid var(--line); background: var(--bg); }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 20px; font: 700 17px var(--font-display); letter-spacing: -.02em; }
.brand-mark { width: 34px; height: 34px; border-radius: 10px; background: #0A0A0A; color: #fff; display: grid; place-items: center; position: relative; font: 900 20px Arial Black, Arial, sans-serif; }
.brand-mark::after { content: ''; position: absolute; right: 5px; bottom: 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
:root[data-theme="dark"] .brand-mark { background: #fff; color: #0A0A0A; }
.brand small { display: block; font: 500 11px var(--font-body); color: var(--muted); letter-spacing: .02em; }
.nav-a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; text-decoration: none; color: var(--muted); font-weight: 500; transition: background .2s, color .2s; }
.nav-a:hover { background: var(--bg-2); color: var(--fg); }
.nav-a.on { background: var(--card); color: var(--fg); box-shadow: var(--shadow); }
.nav-a.on svg { color: var(--accent); }
.nav-a .count { margin-left: auto; font-size: 11px; font-weight: 600; background: var(--accent); color: var(--on-accent); padding: 1px 7px; border-radius: 99px; }
.side-foot { margin-top: auto; display: grid; gap: 8px; }
.side-card { padding: 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.side-card b { display: block; color: var(--fg); font: 700 18px var(--font-display); margin-top: 2px; }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 12px; padding: 14px 28px; background: var(--bg); background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.top-title { font: 700 20px var(--font-display); letter-spacing: -.02em; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.search { position: relative; margin-left: auto; width: min(340px, 40vw); }
.search input { width: 100%; height: 40px; padding: 0 64px 0 38px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); outline: none; }
.search input:focus { border-color: var(--accent); }
.search > svg { position: absolute; left: 12px; top: 11px; color: var(--muted); }
.search kbd { position: absolute; right: 10px; top: 10px; font: 600 11px var(--font-body); color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
.search-res { position: absolute; top: 46px; left: 0; right: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 6px; display: none; max-height: 60vh; overflow: auto; }
.search-res.on { display: block; }
.search-res a { display: flex; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 10px; text-decoration: none; }
.search-res a:hover, .search-res a.sel { background: var(--bg-2); }
.search-res small { color: var(--muted); margin-left: auto; font-size: 11px; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; cursor: pointer; flex: none; transition: border-color .2s, transform .2s; }
.icon-btn:hover { border-color: var(--line-2); }
.icon-btn:active { transform: scale(.96); }
.content { padding: 28px; max-width: 1400px; width: 100%; margin: 0 auto; animation: fade .35s var(--ease); }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.tabbar { display: none; }

/* ---------- components ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-weight: 600; text-decoration: none; white-space: nowrap; transition: transform .15s, background .2s, border-color .2s; }
.btn:hover { border-color: var(--line-2); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.dark { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--bg-2); }
.btn.danger { color: var(--bad); }
.btn.danger-fill { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn:disabled { opacity: .55; pointer-events: none; }
.sync { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); padding: 0 12px; }
.warn-bar { display: flex; gap: 10px; align-items: flex-start; background: var(--warn-soft); color: var(--warn); padding: 12px 14px; border-radius: 12px; margin-bottom: 16px; font-weight: 600; }
.pdf-host { position: fixed; left: -10000px; top: 0; width: 794px; pointer-events: none; }
.pdf-host .paper { box-shadow: none; border-radius: 0; max-width: none; min-height: 1120px; }
.toast.bad { background: var(--bad); color: #fff; }
.toast.has-undo { pointer-events: auto; }
.toast-undo { margin-left: 6px; background: none; border: 0; color: var(--accent); font: 700 14px var(--font-body); cursor: pointer; padding: 4px 6px; border-radius: 8px; }
.toast-undo:hover { background: rgba(255,90,31,.15); }
.pcard { position: relative; }
.pcard .pt { padding-right: 30px; }
.pc-move { position: absolute; top: 9px; right: 9px; width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--muted); display: grid; place-items: center; cursor: pointer; padding: 0; }
.pc-move:hover { color: var(--fg); border-color: var(--line-2); }
.move-grid { display: grid; gap: 8px; }
.move-grid .btn { justify-content: flex-start; height: 46px; }
.move-grid .btn.cur { border-color: var(--accent); }
[hidden] { display: none !important; }
.report { font-size: 11px; }
.report h2 { font: 800 15px var(--font-display); margin: 22px 0 10px; color: #111; letter-spacing: -.01em; }
.rp-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.rp-kpi { border: 1px solid #e8e8e8; border-radius: 8px; padding: 10px; color: #666; }
.rp-kpi b { display: block; font: 800 12.5px var(--font-display); white-space: nowrap; color: #111; margin-top: 2px; }
.rp-kpi.acc { background: var(--pc); border-color: var(--pc); color: #0A0A0A; } .rp-kpi.acc b { color: #0A0A0A; }
.rp-t { width: 100%; border-collapse: collapse; font-size: 10.5px; }
.rp-t th { text-align: left; border-bottom: 2px solid #111; padding: 6px 4px; font-size: 9px; text-transform: uppercase; letter-spacing: .06em; color: #111; }
.rp-t td { border-bottom: 1px solid #eee; padding: 6px 4px; color: #222; }
.rp-t .r { text-align: right; white-space: nowrap; }
.rp-t tfoot td { font-weight: 700; border-top: 2px solid #111; border-bottom: 0; }
.rp-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.ai-btn { color: var(--accent-text); }
.ai-out { white-space: pre-line; font-size: 13px; color: var(--muted); }
.timer-chip { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--fg); font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
.timer-chip .tc-stop { color: var(--accent-text); }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }
@media (max-width: 900px) { .timer-chip .tc-name, .timer-chip .tc-stop { display: none; } .timer-chip { padding: 0 10px; } }
.rate-big { font: 700 30px/1.1 var(--font-display); letter-spacing: -.02em; }
.rate-row { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.rate-row:last-child { border-bottom: 0; }
.rate-row b { font-variant-numeric: tabular-nums; }
.progress2 { display: flex; height: 10px; border-radius: 99px; background: var(--bg-2); overflow: hidden; margin: 8px 0 6px; }
.progress2 i { display: block; height: 100%; }
.progress2 .a { background: var(--accent); } .progress2 .b { background: repeating-linear-gradient(45deg, var(--accent-soft), var(--accent-soft) 4px, transparent 4px, transparent 8px); box-shadow: inset 0 0 0 1px var(--accent-soft); }
.progress2.ok .a { background: var(--ok); } .progress2.over .a { background: var(--bad); } .progress2.warn .a { background: var(--warn); }
.goal { display: grid; gap: 2px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.goal:last-child { border-bottom: 0; }
.goal-h { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
.goal-h b { font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; padding: 3px; gap: 3px; border-radius: 11px; background: var(--bg-2); }
.seg button { border: 0; background: transparent; padding: 7px 16px; border-radius: 8px; font-weight: 600; color: var(--muted); cursor: pointer; }
.seg button.on { background: var(--card); color: var(--fg); box-shadow: var(--shadow); }
.fc-chart { width: 100%; height: auto; display: block; }
.fc-chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.fc-chart .grid-l { stroke: var(--line); }
.cash-in { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.cash-in .in { max-width: 220px; font: 700 18px var(--font-display); }
.amt-in { color: var(--ok); } .amt-out { color: var(--bad); }
.split { display: flex; height: 10px; border-radius: 99px; overflow: hidden; background: var(--bg-2); margin: 10px 0 8px; }
.split i { display: block; height: 100%; }
.src-sal { --src: var(--info); } .src-fl { --src: var(--accent); } .src-au { --src: var(--warn); }
.t tfoot td { font-weight: 700; border-top: 1px solid var(--line-2); border-bottom: 0; }
.btn.sm { height: 32px; padding: 0 11px; border-radius: 10px; font-size: 13px; }
.btn svg.i { width: 16px; height: 16px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.spacer { flex: 1; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.head h2 { font: 700 28px/1.1 var(--font-display); letter-spacing: -.03em; margin: 0; }
.head p { margin: 4px 0 0; color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); min-width: 0; }
.card h3 { margin: 0 0 14px; font: 700 15px var(--font-display); letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.card h3 .btn { margin-left: auto; }
.grid { display: grid; gap: 16px; }
.grid > * { min-width: 0; }
.g2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.g-dash { grid-template-columns: minmax(0,2fr) minmax(0,1fr); }
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 12px; margin-bottom: 16px; }
.kpis.k4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
.kpis.k3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.kpi { padding: 16px 18px; }
.kpi .lbl { font-size: 12px; color: var(--muted); font-weight: 500; display: flex; align-items: center; gap: 6px; }
.kpi .val { font: 700 22px/1.2 var(--font-display); letter-spacing: -.02em; margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.kpi.hero { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.kpi.hero .lbl, .kpi.hero .sub { color: var(--bg); opacity: .72; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.up { color: var(--ok); } .down { color: var(--bad); }

.badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--bg-2); color: var(--muted); }
.badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.b-ok { background: var(--ok-soft); color: var(--ok); }
.b-warn { background: var(--warn-soft); color: var(--warn); }
.b-bad { background: var(--bad-soft); color: var(--bad); }
.b-info { background: var(--info-soft); color: var(--info); }
.b-acc { background: var(--accent-soft); color: var(--accent-text); }

.tabs { display: inline-flex; gap: 4px; padding: 4px; background: var(--bg-2); border-radius: 12px; flex-wrap: wrap; }
.tabs button { border: 0; background: transparent; padding: 7px 14px; border-radius: 9px; cursor: pointer; font-weight: 600; color: var(--muted); }
.tabs button.on { background: var(--card); color: var(--fg); box-shadow: var(--shadow); }

table.t { width: 100%; border-collapse: collapse; }
.t th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.t td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.t tr:last-child td { border-bottom: 0; }
.t tbody tr { transition: background .15s; }
.t tbody tr.click { cursor: pointer; }
.t tbody tr.click:hover { background: var(--bg-2); }
.t .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.t-wrap { overflow-x: auto; margin: 0 -20px; padding: 0 20px; }
.strong { font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 12px; }

.list { display: grid; }
.list > * { min-width: 0; }
.li { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); text-decoration: none; }
.li:last-child { border-bottom: 0; }
.li .grow { flex: 1; min-width: 0; }
.li .grow > div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li-ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--bg-2); flex: none; }
.li-ic.acc { background: var(--accent-soft); color: var(--accent-text); }
.li-ic.ok { background: var(--ok-soft); color: var(--ok); }
.li-ic.bad { background: var(--bad-soft); color: var(--bad); }
.avatar { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font: 700 14px var(--font-display); color: #0A0A0A; flex: none; }

.empty { text-align: center; padding: 40px 20px; color: var(--muted); }
.empty .em-ic { width: 56px; height: 56px; margin: 0 auto 12px; border-radius: 16px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); }
.empty h4 { margin: 0 0 4px; color: var(--fg); font: 700 16px var(--font-display); }
.empty p { margin: 0 0 16px; }

/* chart */
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.chart .grid-l { stroke: var(--line); }
.chart rect.b { transition: opacity .2s; }
.chart g.col:hover rect.b { opacity: .75; }
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.hbar { display: grid; gap: 10px; }
.hbar-row { display: grid; grid-template-columns: 110px 1fr auto; gap: 10px; align-items: center; font-size: 13px; }
.hbar-track { height: 8px; border-radius: 99px; background: var(--bg-2); overflow: hidden; }
.hbar-fill { height: 100%; border-radius: 99px; background: var(--accent); transition: width .6s var(--ease); }
.progress { height: 6px; border-radius: 99px; background: var(--bg-2); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }

/* kanban */
.kanban { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 12px; scroll-snap-type: x mandatory; }
.col { background: var(--bg-2); border-radius: var(--radius); padding: 10px; min-height: 200px; scroll-snap-align: start; transition: background .2s, outline-color .2s; outline: 2px dashed transparent; outline-offset: -2px; }
.col.drop { outline-color: var(--accent); background: var(--accent-soft); }
.col-h { display: flex; align-items: center; gap: 8px; padding: 4px 6px 10px; font-weight: 600; font-size: 13px; }
.col-h .muted { margin-left: auto; font-weight: 500; }
.pcard { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 8px; text-decoration: none; cursor: grab; box-shadow: var(--shadow); transition: transform .2s var(--ease), box-shadow .2s; }
.pcard:hover { transform: translateY(-2px); }
.pcard.dragging { opacity: .5; }
.pcard .pt { font-weight: 600; margin-bottom: 2px; }

function relDate(s) {
  const d = daysBetween(today(), s);
  if (d === 0) return "Aujourd'hui"; if (d === 1) return 'Demain'; if (d === -1) return 'Hier';
  if (d < 0) return `Il y a ${-d} j`; if (d < 7) return `Dans ${d} j`; return fdate(s).replace(/ \d{4}$/, '');
}
function barChart(series) {
  const W = innerWidth < 600 ? 360 : 640, H = innerWidth < 600 ? 220 : 240, pl = 44, pb = 26, pt = 10;
  const max = Math.max(CUR[S.settings.currency].d ? 100 : 100000, ...series.flatMap(s => [s.inc + (s.sal || 0), s.exp]));
  const nice = (() => { const p = Math.pow(10, Math.floor(Math.log10(max))); return Math.ceil(max / p) * p; })();
  const cw = (W - pl) / series.length, bw = Math.min(26, cw / 3.4), h = H - pb - pt;
  const y = v => pt + h - v / nice * h;
  let g = '';
  for (let i = 0; i <= 4; i++) { const val = nice * i / 4; g += `<line class="grid-l" x1="${pl}" x2="${W}" y1="${y(val)}" y2="${y(val)}"/><text x="${pl - 8}" y="${y(val) + 4}" text-anchor="end">${compact(val)}</text>`; }
  series.forEach((s, i) => {
    const cx = pl + cw * i + cw / 2, [yy, mm] = s.m.split('-');
    const sal = s.sal || 0, top = s.inc + sal;
    g += `<g class="col"><title>${MONTHS[+mm - 1]} ${yy} — ${sal ? `Salaire : ${money(sal)} · ` : ''}Freelance & autres : ${money(s.inc)} · Dépenses : ${money(s.exp)}</title><rect x="${pl + cw * i}" y="${pt}" width="${cw}" height="${h}" fill="transparent"/>
      ${sal ? `<rect class="b" x="${cx - bw - 2}" y="${y(sal)}" width="${bw}" height="${Math.max(0, H - pb - y(sal))}" rx="${s.inc ? 0 : 5}" fill="var(--sal)"/>` : ''}
      ${s.inc ? `<rect class="b" x="${cx - bw - 2}" y="${y(top)}" width="${bw}" height="${Math.max(0, y(sal) - y(top))}" rx="5" fill="var(--inc)"/>` : ''}
      <rect class="b" x="${cx + 2}" y="${y(s.exp)}" width="${bw}" height="${Math.max(0, H - pb - y(s.exp))}" rx="5" fill="var(--exp)"/>
      <text x="${cx}" y="${H - 6}" text-anchor="middle">${MONTHS[+mm - 1]}</text></g>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Revenus et dépenses des 6 derniers mois">${g}</svg>`;
}

function bindKanban() {

    c.addEventListener('dragend', () => { c.classList.remove('dragging'); $$('.col').forEach(x => x.classList.remove('drop')); });
  });
  $$('.col').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('drop'); });
    col.addEventListener('dragleave', () => col.classList.remove('drop'));
    col.addEventListener('drop', e => { e.preventDefault(); const p = project(dragId); if (p && p.status !== col.dataset.col) { p.status = col.dataset.col; save(); toast(`« ${p.name} » → ${pstat(p.status).l}`); route(); } });

/* ---------- reminders ---------- */
const RLEVELS = [null, { l: 'Rappel courtois' }, { l: 'Relance' }, { l: 'Dernier rappel' }];
function reminderText(d, level) {
  const c = client(d.clientId), t = totals(d), first = c ? ' ' + (c.name || '').split(' ')[0] : '';
  const late = isOverdue(d) ? daysBetween(d.dueDate, today()) : 0, wave = waveFor(d), amt = dm(d, t.due);
  const pay = S.settings.payInfo ? `\n\nPour le règlement :\n${S.settings.payInfo}` : '', sig = `\n\n${level === 1 ? 'Merci beaucoup' : 'Cordialement'},\n${S.settings.name}`;
  if (level === 1) return `Bonjour${first},\n\nJ'espère que vous allez bien. Petit rappel concernant la facture ${d.number}${d.subject ? ` (« ${d.subject} »)` : ''} d'un montant de ${amt}, ${late ? `arrivée à échéance le ${fdate(d.dueDate)}` : `à régler avant le ${fdate(d.dueDate)}`}.${wave ? `\nPaiement Wave en un clic : ${wave}` : ''}${pay}${sig}`;
  if (level === 2) return `Bonjour${first},\n\nSauf erreur de ma part, la facture ${d.number} de ${amt}, échue depuis le ${fdate(d.dueDate)}${late ? ` (${late} jours)` : ''}, n'a pas encore été réglée. Pourriez-vous me confirmer la date de paiement prévue ?${wave ? `\nPaiement Wave : ${wave}` : ''}${pay}${sig}`;
  return `Bonjour${first},\n\nMalgré mes précédents rappels, la facture ${d.number} de ${amt}, échue le ${fdate(d.dueDate)}, reste impayée à ce jour. Je vous remercie de procéder au règlement sous 7 jours. Sans retour de votre part, je devrai engager les démarches prévues dans nos conditions.${pay}${sig}`;
}
const lastReminder = d => (d.reminders || []).slice(-1)[0];
function remindModal(id) {
  const d = doc(id); if (!d) return;
  const c = client(d.clientId), prev = d.reminders || [];
  let level = Math.min(3, prev.length + 1);
  modal(`Relancer ${d.number}`, `<div class="f">
    <div class="tabs" id="rl-tabs" role="tablist">${[1, 2, 3].map(n => `<button type="button" data-rl="${n}">${RLEVELS[n].l}</button>`).join('')}</div>
    <label class="fl">Message (modifiable)<textarea class="in" id="rl-msg" style="min-height:230px"></textarea></label>
    ${SAMPLE ? `<button type="button" class="btn sm" id="rl-ai" style="justify-self:start">${ic('spark')}Reformuler avec Claude</button>` : ''}
    <div class="row"><a class="btn primary" id="rl-wa" target="_blank" rel="noopener">${ic('chat')}Envoyer sur WhatsApp</a><a class="btn" id="rl-mail">${ic('mail')}E-mail</a><button type="button" class="btn" id="rl-copy">${ic('copy')}Copier</button></div>
    ${!c?.phone ? '<p class="hint" style="margin:0">Pas de numéro pour ce client : WhatsApp te laissera choisir le contact.</p>' : ''}
    ${prev.length ? `<div><div class="small muted strong" style="margin-bottom:4px">Déjà relancé</div><div class="list">${prev.slice().reverse().map(r => `<div class="li small"><span class="grow">${RLEVELS[r.level]?.l || 'Relance'} · ${esc(r.channel)}</span><span class="muted">${fdate(r.date)}</span></div>`).join('')}</div></div>` : ''}
  </div>`, { wide: true });
  const ta = $('#rl-msg');
  const sync = () => { const m = ta.value, phone = (c?.phone || '').replace(/[^\d]/g, ''); $('#rl-wa').href = `https://wa.me/${phone}?text=${encodeURIComponent(m)}`; $('#rl-mail').href = `mailto:${encodeURIComponent(c?.email || '')}?subject=${encodeURIComponent(`${RLEVELS[level].l} — facture ${d.number}`)}&body=${encodeURIComponent(m)}`; };
  const setLevel = n => { level = n; $$('#rl-tabs [data-rl]').forEach(b => b.classList.toggle('on', +b.dataset.rl === n)); ta.value = reminderText(d, n); sync(); };
  setLevel(level);
  ta.oninput = sync;
  $$('#rl-tabs [data-rl]').forEach(b => b.onclick = () => setLevel(+b.dataset.rl));
  const log = ch => { (d.reminders = d.reminders || []).push({ id: uid(), date: today(), level, channel: ch }); save(); setTimeout(() => { closeModal(); toast('Relance notée dans l\'historique'); route(); }, 50); };
  $('#rl-wa').addEventListener('click', () => log('WhatsApp'));
  $('#rl-mail').addEventListener('click', () => log('E-mail'));
  $('#rl-copy').onclick = async () => { let ok = true; try { await navigator.clipboard.writeText(ta.value); } catch { ok = false; ta.focus(); ta.select(); } if (ok) log('Message copié'); else toast('Copie bloquée : le texte est sélectionné, fais Copier', 'bad'); };
  const ai = $('#rl-ai'); if (ai) ai.onclick = () => aiReminder(ta, level, d, sync, ai);
}

const readAsDataURL = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });
async function shrinkImage(file, max, q, alpha) {
  const url = await readAsDataURL(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
  const k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
  const ctx = c.getContext('2d');
  if (!alpha) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); }
  ctx.drawImage(img, 0, 0, c.width, c.height);
  return alpha ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', q);
}

routes.client = (v, id) => {

async function download(name, content, type) {
  const blob = content instanceof Blob ? content : new Blob([content], { type });
  if (DL) {
    try { await DL.save({ filename: name, data: blob }); return true; }
    catch (e) { if (!e || e.code !== 'declined') toast(e && e.code === 'rate_limited' ? 'Un téléchargement est déjà en cours' : 'Téléchargement impossible ici', 'bad'); return false; }
  }
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); return true; }
  catch { toast('Téléchargement bloqué par le navigateur', 'bad'); return false; }
}
function exportCSV() {
  const rows = [['Date', 'Type', 'Libellé', 'Catégorie / Moyen', 'Client', 'Projet', 'Montant']];
  allIncomes().forEach(i => rows.push([i.date, `Revenu (${SOURCES[i.source]})`, i.label, i.method || '', i.clientId ? cName(i.clientId) : '', project(i.projectId)?.name || '', i.amount]));
  S.expenses.forEach(e => rows.push([e.date, e.scope === 'perso' ? 'Dépense perso' : 'Dépense pro', e.label, e.category, '', project(e.projectId)?.name || '', -num(e.amount)]));
  rows.sort((a, b) => a === rows[0] ? -1 : b === rows[0] ? 1 : a[0].localeCompare(b[0]));
  const csv = '﻿' + rows.map(r => r.map(x => `"${String(x).replace(/"/g, '""')}"`).join(';')).join('\n');
  download(`dak-finances-${today()}.csv`, csv, 'text/csv;charset=utf-8').then(ok => ok && toast('Export CSV téléchargé'));
}
$('#file-import').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  let data;
  try { data = JSON.parse(await f.text()); if (!data || !data.settings || !Array.isArray(data.docs)) throw 0; }
  catch { return ask("Ce fichier n'est pas une sauvegarde valide.", { ok: 'OK', danger: false, title: 'Fichier invalide', cancel: false }); }
  if (!(await ask('Remplacer toutes les données actuelles par cette sauvegarde ?', { ok: 'Remplacer', title: 'Restaurer' }))) return;
  S = normalize(data); save(); applyTheme(); toast('Sauvegarde restaurée'); route();
};

  const lateInv = S.docs.find(d => d.kind === 'facture' && d.projectId === p2.id && d.lines.length === 3); if (lateInv) lateInv.reminders = [{ id: uid(), date: addDays(t, -18), level: 1, channel: 'WhatsApp' }, { id: uid(), date: addDays(t, -6), level: 2, channel: 'WhatsApp' }];

  const st = S.settings;
  if (!num(st.goalMonth)) st.goalMonth = 400000;

  if (st.cashBalance === '' || st.cashBalance == null) { st.cashBalance = 420000; st.cashDate = t; }

  S.incomes.push({ id: uid(), label: 'Salaire — Agence (exemple)', amount: 600000, date: (() => { const d = new Date(t + 'T00:00:00'); d.setDate(1); d.setMonth(d.getMonth() - 5); return iso(d).slice(0, 8) + '05'; })(), method: 'Virement', clientId: '', source: 'salaire', recurring: true });

/* ---------- global actions ---------- */
function quickNew() {
  modal('Créer', `<div class="grid g2">${[['new-project', 'folder', 'Projet', 'avec devis automatique'], ['new-doc|devis', 'file', 'Devis', ''], ['new-doc|proforma', 'file', 'Facture proforma', ''], ['new-doc|facture', 'receipt', 'Facture', ''], ['new-income', 'in', 'Revenu', 'salaire, vente…'], ['new-expense', 'out', 'Dépense', ''], ['new-client', 'users', 'Client', ''], ['new-salary', 'wallet', 'Salaire', 'mensuel automatique']].map(([a, i, l, s]) => `<button type="button" class="btn" style="height:auto;padding:14px;justify-content:flex-start" data-q="${a}"><span class="li-ic acc">${ic(i)}</span><span style="text-align:left">${l}${s ? `<br><span class="small muted" style="font-weight:400">${s}</span>` : ''}</span></button>`).join('')}</div>`);
  $$('[data-q]').forEach(b => b.onclick = () => { closeModal(); const [a, k] = b.dataset.q.split('|'); setTimeout(() => act(a, { kind: k }), 80); });
}
function act(a, ds = {}) {
  switch (a) {
    case 'quick': return quickNew();
    case 'new-project': return newProject(ds.client);
    case 'edit-project': return editProject(ds.id);
    case 'new-doc': return createDoc(ds.kind, ds.project, ds.client);
    case 'new-client': return clientModal();
    case 'edit-client': return clientModal(ds.id);
    case 'new-expense': return expenseModal(null, ds.project);
    case 'new-income': return incomeModal();
    case 'new-salary': return incomeModal(null, { source: 'salaire', method: 'Virement', label: 'Salaire' });
    case 'pay': return payModal(ds.id);
    case 'print': return printDoc(curId());
    case 'pdf': return pdfDoc(curId());
    case 'dup-doc': { const src = doc(ds.id); const c = JSON.parse(JSON.stringify(src)); delete c.id; delete c.number; delete c.issuedAt; c.reminders = []; const n = newDoc(src.kind, { ...c, date: today(), dueDate: addDays(today(), src.kind === 'facture' ? num(S.settings.payDays) : num(S.settings.quoteDays)), status: 'brouillon', payments: [], fromId: '', createdAt: Date.now() }); n.lines.forEach(l => l.id = uid()); save(); toast('Document dupliqué'); return go(`#document-${n.id}`); }
    case 'emit': { const d = doc(ds.id); ask(`Émettre ${d.number} ? ${d.kind === 'avoir' ? "L'avoir" : 'La facture'} sera verrouillé${d.kind === 'avoir' ? '' : 'e'} : ni modification ni suppression, seulement un avoir pour corriger.`, { ok: 'Émettre', danger: false, title: 'Émettre le document' }).then(y => { if (!y) return; d.status = 'envoye'; if (!d.issuedAt) d.issuedAt = today(); save(); toast(`${d.number} émis${d.kind === 'avoir' ? '' : 'e'}`); route(); }); return; }
    case 'unlock': { const d = doc(ds.id); ask('Repasser ce document en brouillon ? À faire seulement s\'il n\'a pas encore été envoyé au client.', { ok: 'Repasser en brouillon', danger: false, title: 'Déverrouiller' }).then(y => { if (!y) return; d.status = 'brouillon'; save(); route(); }); return; }
    case 'avoir': { const f = doc(ds.id); const n = newDoc('avoir', { clientId: f.clientId, projectId: f.projectId, subject: `Avoir sur facture ${f.number}`, lines: f.lines.map(l => ({ ...l, id: uid() })), discount: f.discount, taxOn: f.taxOn, taxRate: f.taxRate, currency: docCur(f), rate: f.rate, fromId: f.id, dueDate: today() }); toast('Avoir créé : ajuste les montants pour un avoir partiel'); return go(`#document-${n.id}`); }
    case 'del-doc': if (locked(doc(ds.id))) return ask('Un document émis ne peut pas être supprimé. Crée un avoir pour l\'annuler.', { ok: 'Compris', danger: false, title: 'Document verrouillé', cancel: false }); ask('Supprimer ce document ?').then(y => { if (y) { undoable('Document supprimé', () => { S.docs = S.docs.filter(d => d.id !== ds.id); }); go('#documents'); } }); return;
    case 'bill-revisions': { const p = project(ds.id); const extra = num(p.revUsed) - num(p.revIncluded); const price = (S.catalog.find(c => /correction/i.test(c.label)) || {}).price || 30000; const d = newDoc('facture', { clientId: p.clientId, projectId: p.id, subject: `${p.name} — corrections supplémentaires`, lines: [{ id: uid(), desc: 'Série de corrections supplémentaire', qty: extra, price }] }); return go(`#document-${d.id}`); }
    case 'export': download(`dak-gestion-sauvegarde-${today()}.json`, JSON.stringify(S, null, 1), 'application/json').then(ok => { if (!ok) return; S.settings.lastBackup = today(); save(); toast('Sauvegarde téléchargée'); if (/^#?(tableau)?$/.test(location.hash) || /parametres/.test(location.hash)) route(); }); return;
    case 'snooze-backup': S.settings.backupSnooze = addDays(today(), 7); save(); return route();
    case 'remind': return remindModal(ds.id);
    case 'start-timer': startTimer(ds.id); return route();
    case 'stop-timer': stopTimer(); return route();
    case 'pf': { const pj = project(ds.id); if (pj) { pj.portfolio = ds.pf; save(); toast(ds.pf === 'publie' ? 'Marqué publié sur le portfolio' : ds.pf === 'a_publier' ? 'Ajouté à la liste « à publier »' : 'Retiré des suggestions portfolio'); route(); } return; }
    case 'report': return pdfReport(ds.year);
    case 'goals': UI.setTab = 'objectifs'; return go('#parametres');
    case 'import': return $('#file-import').click();
    case 'csv': return exportCSV();
    case 'demo': if (!S.docs.length) return seedDemo(); ask("Ajouter des données d'exemple à tes données actuelles ?", { ok: 'Ajouter', danger: false, title: 'Exemples' }).then(y => y && seedDemo()); return;
    case 'reset': ask('Effacer TOUTES les données ? Pense à exporter une sauvegarde avant.', { ok: 'Tout effacer', title: 'Tout effacer' }).then(y => { if (!y) return; undoable('Données effacées', () => { const th = S.settings.theme; S = defaults(); S.settings.theme = th; }); go('#tableau'); }); return;
  }
}
document.addEventListener('click', e => {
  const mv = e.target.closest('[data-move]');
  if (mv) { e.preventDefault(); e.stopPropagation(); return moveModal(mv.dataset.move); }
  const a = e.target.closest('[data-act]');
  if (a) { e.preventDefault(); return act(a.dataset.act, a.dataset); }
  const tr = e.target.closest('tr[data-href]');
  if (tr && !e.target.closest('a,button')) return go(tr.dataset.href);
  const pv = e.target.closest('[data-pview]'); if (pv) { UI.pView = pv.dataset.pview; lsSet('dak-pview', UI.pView); return route(); }
  const stb = e.target.closest('[data-settab]'); if (stb) { UI.setTab = stb.dataset.settab; return route(); }
  const dt = e.target.closest('[data-doctab]'); if (dt) { UI.docTab = dt.dataset.doctab; return route(); }
  const ft = e.target.closest('[data-fintab]'); if (ft) { UI.finTab = ft.dataset.fintab; return route(); }
  const fl = e.target.closest('[data-fin]'); if (fl) { UI.finTab = fl.dataset.fin; if (location.hash === '#finances') { e.preventDefault(); route(); } }
});

$('#toast').addEventListener('click', e => { if (!e.target.closest('.toast-undo') || !UNDO) return; S = normalize(JSON.parse(UNDO)); UNDO = null; save(); applyTheme(); toast('Suppression annulée'); route(); });

/* ---------- search ---------- */
const q = $('#q'), qr = $('#q-res');
let qSel = 0;
function searchRender() {
  const s = q.value.trim().toLowerCase();
  if (!s) { qr.classList.remove('on'); return; }
  const res = [];
  S.clients.forEach(c => { if (`${c.name} ${c.company} ${c.email} ${c.phone}`.toLowerCase().includes(s)) res.push({ h: `#client-${c.id}`, i: 'users', t: c.company || c.name, k: 'Client' }); });
  S.projects.forEach(p => { if (`${p.name} ${p.type} ${cName(p.clientId)}`.toLowerCase().includes(s)) res.push({ h: `#projet-${p.id}`, i: 'folder', t: p.name, k: 'Projet' }); });
  S.docs.forEach(d => { if (`${d.number} ${d.subject} ${cName(d.clientId)}`.toLowerCase().includes(s)) res.push({ h: `#document-${d.id}`, i: 'file', t: `${d.number} · ${cName(d.clientId)}`, k: KSHORT[d.kind] }); });
  qSel = 0;
  qr.innerHTML = res.length ? res.slice(0, 10).map((r, i) => `<a href="${r.h}" class="${i === 0 ? 'sel' : ''}">${ic(r.i)}<span>${esc(r.t)}</span><small>${r.k}</small></a>`).join('') : '<div class="muted" style="padding:10px">Aucun résultat</div>';
  qr.classList.add('on');
}
q.addEventListener('input', searchRender);
q.addEventListener('focus', searchRender);
q.addEventListener('keydown', e => {
  const items = $$('a', qr);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (!items.length) return; items[qSel]?.classList.remove('sel'); qSel = (qSel + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length; items[qSel].classList.add('sel'); }
  if (e.key === 'Enter' && items[qSel]) { e.preventDefault(); go(items[qSel].getAttribute('href')); q.value = ''; qr.classList.remove('on'); q.blur(); }
  if (e.key === 'Escape') { q.value = ''; qr.classList.remove('on'); q.blur(); }
});
qr.addEventListener('click', e => { if (e.target.closest('a')) { q.value = ''; qr.classList.remove('on'); } });
document.addEventListener('click', e => { if (!e.target.closest('.search')) qr.classList.remove('on'); });
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); q.focus(); q.select(); }
  else if (e.key.toLowerCase() === 'n' && !e.metaKey && !e.ctrlKey && !e.altKey && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && !$('#modal').open) { e.preventDefault(); quickNew(); }
});

/* ---------- boot ---------- */
async function boot() {
  applyTheme(); setSync();
  if (window.claude && typeof window.claude.use === 'function') {
    $('#view').innerHTML = `<div class="empty"><div class="em-ic">${ic('clock', 'width:24px;height:24px')}</div><h4>Chargement de tes données…</h4></div>`;
    try {
      const [db, user, dl, smp] = await Promise.all([window.claude.use('db'), window.claude.use('user'), window.claude.use('downloads').catch(() => null), window.claude.use('sample').catch(() => null)]);
      DL = dl; SAMPLE = smp;
      const uidv = user ? await user.id() : null;
      if (db && uidv) {
        const col = db.collection('data/users/' + uidv);
        const snap = await Promise.race([col.get(), new Promise((_, rej) => setTimeout(() => rej({ code: 'timeout' }), 15000))]);
        const docs = snap.docs.filter(x => x.exists).map(x => [x.id, JSON.parse(JSON.stringify(x.data()))]);
        CLOUD = col; MODE = 'cloud';
        docs.forEach(([k, b]) => { lastDocs[k] = JSON.stringify(b); });
        if (docs.length) S = fromDocs(docs);
        else { const raw = lsGet(KEY); if (raw) { try { S = normalize(JSON.parse(raw)); } catch { /* ignore */ } } }
      }
    } catch (e) { console.warn('Compte indisponible, enregistrement local', e); }
  }
  if (MODE !== 'cloud') {
    MODE = LS ? 'local' : 'memory';
    const raw = lsGet(KEY);
    if (raw) { try { S = normalize(JSON.parse(raw)); } catch { /* ignore */ } }
  }
  ensureRecurring(); save();
  applyTheme(); route(); renderTimer();
}
boot();
window.addEventListener('load', () => { if (S.settings.waveLink && /^#document-/.test(location.hash)) route(); });
</script>
