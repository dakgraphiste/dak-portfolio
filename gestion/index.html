<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dak Studio Gestion</title>
<meta name="theme-color" content="#0C0C0E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230A0A0A'/%3E%3Ctext x='13' y='45' font-family='Arial Black,Arial' font-weight='900' font-size='38' fill='%23fff'%3Ed%3C/text%3E%3Ccircle cx='49' cy='41' r='6' fill='%23FF5A1F'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F4F4F2; --bg-2: #EBEBE8; --card: #FFFFFF; --fg: #0C0C0E; --muted: #5E5E64; --line: rgba(0,0,0,.10); --line-2: rgba(0,0,0,.16);
  --accent: #FF5A1F; --accent-soft: rgba(255,90,31,.12); --accent-text: #C2410C; --on-accent: #0A0A0A;
  --ok: #15803D; --ok-soft: rgba(21,128,61,.12); --warn: #B45309; --warn-soft: rgba(180,83,9,.13);
  --bad: #C0262D; --bad-soft: rgba(192,38,45,.11); --info: #1D5FD1; --info-soft: rgba(29,95,209,.11);
  --inc: #FF5A1F; --sal: #3B6FE0; --exp: #8B8B93;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
  --radius: 16px; --ease: cubic-bezier(.2,.8,.2,1);
  --font-display: 'Syne', system-ui, sans-serif; --font-body: 'Inter', system-ui, sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0C0C0E; --bg-2: #141417; --card: #17171B; --fg: #F4F4F2; --muted: #A2A2A9; --line: rgba(255,255,255,.09); --line-2: rgba(255,255,255,.16);
  --accent-soft: rgba(255,90,31,.16); --accent-text: #FF7A3D;
  --ok: #4ADE80; --ok-soft: rgba(74,222,128,.13); --warn: #FBBF24; --warn-soft: rgba(251,191,36,.13);
  --bad: #F87171; --bad-soft: rgba(248,113,113,.14); --info: #7AA7FF; --info-soft: rgba(122,167,255,.14);
  --sal: #7AA7FF; --exp: #5C5C66;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0C0C0E; --bg-2: #141417; --card: #17171B; --fg: #F4F4F2; --muted: #A2A2A9; --line: rgba(255,255,255,.09); --line-2: rgba(255,255,255,.16);
  --accent-soft: rgba(255,90,31,.16); --accent-text: #FF7A3D;
  --ok: #4ADE80; --ok-soft: rgba(74,222,128,.13); --warn: #FBBF24; --warn-soft: rgba(251,191,36,.13);
  --bad: #F87171; --bad-soft: rgba(248,113,113,.14); --info: #7AA7FF; --info-soft: rgba(122,167,255,.14);
  --sal: #7AA7FF; --exp: #5C5C66;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
} }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; transition: background-color .3s, color .3s; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
::selection { background: var(--accent); color: #0A0A0A; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- layout ---------- */
.app { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; padding: 20px 14px; border-right: 1px solid var(--line); background: var(--bg); }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 20px; font: 700 17px var(--font-display); letter-spacing: -.02em; }
.brand-mark { width: 34px; height: 34px; border-radius: 10px; background: #0A0A0A; color: #fff; display: grid; place-items: center; position: relative; font: 900 20px Arial Black, Arial, sans-serif; }
.brand-mark::after { content: ''; position: absolute; right: 5px; bottom: 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
:root[data-theme="dark"] .brand-mark { background: #fff; color: #0A0A0A; }
.brand small { display: block; font: 500 11px var(--font-body); color: var(--muted); letter-spacing: .02em; }
.nav-a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; text-decoration: none; color: var(--muted); font-weight: 500; transition: background .2s, color .2s; }
.nav-a:hover { background: var(--bg-2); color: var(--fg); }
.nav-a.on { background: var(--card); color: var(--fg); box-shadow: var(--shadow); }
.nav-a.on svg { color: var(--accent); }
.nav-a .count { margin-left: auto; font-size: 11px; font-weight: 600; background: var(--accent); color: var(--on-accent); padding: 1px 7px; border-radius: 99px; }
.side-foot { margin-top: auto; display: grid; gap: 8px; }
.side-card { padding: 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.side-card b { display: block; color: var(--fg); font: 700 18px var(--font-display); margin-top: 2px; }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 12px; padding: 14px 28px; background: var(--bg); background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.top-title { font: 700 20px var(--font-display); letter-spacing: -.02em; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.search { position: relative; margin-left: auto; width: min(340px, 40vw); }
.search input { width: 100%; height: 40px; padding: 0 64px 0 38px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); outline: none; }
.search input:focus { border-color: var(--accent); }
.search > svg { position: absolute; left: 12px; top: 11px; color: var(--muted); }
.search kbd { position: absolute; right: 10px; top: 10px; font: 600 11px var(--font-body); color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
.search-res { position: absolute; top: 46px; left: 0; right: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 6px; display: none; max-height: 60vh; overflow: auto; }
.search-res.on { display: block; }
.search-res a { display: flex; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 10px; text-decoration: none; }
.search-res a:hover, .search-res a.sel { background: var(--bg-2); }
.search-res small { color: var(--muted); margin-left: auto; font-size: 11px; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; cursor: pointer; flex: none; transition: border-color .2s, transform .2s; }
.icon-btn:hover { border-color: var(--line-2); }
.icon-btn:active { transform: scale(.96); }
.content { padding: 28px; max-width: 1400px; width: 100%; margin: 0 auto; animation: fade .35s var(--ease); }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.tabbar { display: none; }

/* ---------- components ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-weight: 600; text-decoration: none; white-space: nowrap; transition: transform .15s, background .2s, border-color .2s; }
.btn:hover { border-color: var(--line-2); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.dark { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--bg-2); }
.btn.danger { color: var(--bad); }
.btn.danger-fill { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn:disabled { opacity: .55; pointer-events: none; }
.sync { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); padding: 0 12px; }
.warn-bar { display: flex; gap: 10px; align-items: flex-start; background: var(--warn-soft); color: var(--warn); padding: 12px 14px; border-radius: 12px; margin-bottom: 16px; font-weight: 600; }
.pdf-host { position: fixed; left: -10000px; top: 0; width: 794px; pointer-events: none; }
.pdf-host .paper { box-shadow: none; border-radius: 0; max-width: none; min-height: 1120px; }
.toast.bad { background: var(--bad); color: #fff; }
.split { display: flex; height: 10px; border-radius: 99px; overflow: hidden; background: var(--bg-2); margin: 10px 0 8px; }
.split i { display: block; height: 100%; }
.src-sal { --src: var(--info); } .src-fl { --src: var(--accent); } .src-au { --src: var(--warn); }
.t tfoot td { font-weight: 700; border-top: 1px solid var(--line-2); border-bottom: 0; }
.btn.sm { height: 32px; padding: 0 11px; border-radius: 10px; font-size: 13px; }
.btn svg.i { width: 16px; height: 16px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.spacer { flex: 1; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.head h2 { font: 700 28px/1.1 var(--font-display); letter-spacing: -.03em; margin: 0; }
.head p { margin: 4px 0 0; color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); min-width: 0; }
.card h3 { margin: 0 0 14px; font: 700 15px var(--font-display); letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.card h3 .btn { margin-left: auto; }
.grid { display: grid; gap: 16px; }
.grid > * { min-width: 0; }
.g2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.g-dash { grid-template-columns: minmax(0,2fr) minmax(0,1fr); }
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 12px; margin-bottom: 16px; }
.kpis.k4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
.kpis.k3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.kpi { padding: 16px 18px; }
.kpi .lbl { font-size: 12px; color: var(--muted); font-weight: 500; display: flex; align-items: center; gap: 6px; }
.kpi .val { font: 700 22px/1.2 var(--font-display); letter-spacing: -.02em; margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.kpi.hero { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.kpi.hero .lbl, .kpi.hero .sub { color: var(--bg); opacity: .72; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.up { color: var(--ok); } .down { color: var(--bad); }

.badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--bg-2); color: var(--muted); }
.badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.b-ok { background: var(--ok-soft); color: var(--ok); }
.b-warn { background: var(--warn-soft); color: var(--warn); }
.b-bad { background: var(--bad-soft); color: var(--bad); }
.b-info { background: var(--info-soft); color: var(--info); }
.b-acc { background: var(--accent-soft); color: var(--accent-text); }

.tabs { display: inline-flex; gap: 4px; padding: 4px; background: var(--bg-2); border-radius: 12px; flex-wrap: wrap; }
.tabs button { border: 0; background: transparent; padding: 7px 14px; border-radius: 9px; cursor: pointer; font-weight: 600; color: var(--muted); }
.tabs button.on { background: var(--card); color: var(--fg); box-shadow: var(--shadow); }

table.t { width: 100%; border-collapse: collapse; }
.t th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.t td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.t tr:last-child td { border-bottom: 0; }
.t tbody tr { transition: background .15s; }
.t tbody tr.click { cursor: pointer; }
.t tbody tr.click:hover { background: var(--bg-2); }
.t .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.t-wrap { overflow-x: auto; margin: 0 -20px; padding: 0 20px; }
.strong { font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 12px; }

.list { display: grid; }
.list > * { min-width: 0; }
.li { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); text-decoration: none; }
.li:last-child { border-bottom: 0; }
.li .grow { flex: 1; min-width: 0; }
.li .grow > div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li-ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--bg-2); flex: none; }
.li-ic.acc { background: var(--accent-soft); color: var(--accent-text); }
.li-ic.ok { background: var(--ok-soft); color: var(--ok); }
.li-ic.bad { background: var(--bad-soft); color: var(--bad); }
.avatar { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font: 700 14px var(--font-display); color: #0A0A0A; flex: none; }

.empty { text-align: center; padding: 40px 20px; color: var(--muted); }
.empty .em-ic { width: 56px; height: 56px; margin: 0 auto 12px; border-radius: 16px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); }
.empty h4 { margin: 0 0 4px; color: var(--fg); font: 700 16px var(--font-display); }
.empty p { margin: 0 0 16px; }

/* chart */
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.chart .grid-l { stroke: var(--line); }
.chart rect.b { transition: opacity .2s; }
.chart g.col:hover rect.b { opacity: .75; }
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.hbar { display: grid; gap: 10px; }
.hbar-row { display: grid; grid-template-columns: 110px 1fr auto; gap: 10px; align-items: center; font-size: 13px; }
.hbar-track { height: 8px; border-radius: 99px; background: var(--bg-2); overflow: hidden; }
.hbar-fill { height: 100%; border-radius: 99px; background: var(--accent); transition: width .6s var(--ease); }
.progress { height: 6px; border-radius: 99px; background: var(--bg-2); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }

/* kanban */
.kanban { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 12px; scroll-snap-type: x mandatory; }
.col { background: var(--bg-2); border-radius: var(--radius); padding: 10px; min-height: 200px; scroll-snap-align: start; transition: background .2s, outline-color .2s; outline: 2px dashed transparent; outline-offset: -2px; }
.col.drop { outline-color: var(--accent); background: var(--accent-soft); }
.col-h { display: flex; align-items: center; gap: 8px; padding: 4px 6px 10px; font-weight: 600; font-size: 13px; }
.col-h .muted { margin-left: auto; font-weight: 500; }
.pcard { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 8px; text-decoration: none; cursor: grab; box-shadow: var(--shadow); transition: transform .2s var(--ease), box-shadow .2s; }
.pcard:hover { transform: translateY(-2px); }
.pcard.dragging { opacity: .5; }
.pcard .pt { font-weight: 600; margin-bottom: 2px; }
.pcard .pm { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; color: var(--muted); }

/* forms */
.f { display: grid; gap: 14px; }
.f2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.f3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
label.fl { display: grid; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); min-width: 0; }
.in, select.in, textarea.in { width: 100%; height: 42px; padding: 0 12px; border-radius: 11px; border: 1px solid var(--line-2); background: var(--bg); color: var(--fg); outline: none; font-weight: 400; font-size: 14px; transition: border-color .2s, box-shadow .2s; min-width: 0; }
textarea.in { height: auto; min-height: 80px; padding: 10px 12px; resize: vertical; }
.in:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.check { display: flex; align-items: center; gap: 10px; font-weight: 500; color: var(--fg); font-size: 14px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.hint { font-size: 12px; color: var(--muted); font-weight: 400; }

dialog.modal { border: 0; padding: 0; border-radius: 20px; background: var(--card); color: var(--fg); width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 40px); box-shadow: 0 30px 80px rgba(0,0,0,.35); }
dialog.modal::backdrop { background: rgba(10,10,12,.5); backdrop-filter: blur(4px); }
dialog.modal[open] { animation: pop .25s var(--ease); }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
.m-h { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 0; }
.m-h h3 { margin: 0; font: 700 18px var(--font-display); }
.m-b { padding: 18px 20px; overflow: auto; max-height: calc(100vh - 180px); }
.m-f { padding: 0 20px 18px; display: flex; justify-content: flex-end; gap: 8px; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: var(--fg); color: var(--bg); padding: 12px 18px; border-radius: 12px; font-weight: 600; opacity: 0; pointer-events: none; transition: .3s var(--ease); z-index: 100; display: flex; gap: 8px; align-items: center; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* doc editor */
.doc-layout { display: grid; grid-template-columns: minmax(0, 440px) minmax(0, 1fr); gap: 20px; align-items: start; }
.doc-preview-wrap { container-type: inline-size; position: sticky; top: 90px; background: var(--bg-2); border-radius: var(--radius); padding: 24px; overflow: auto; }
.lines { display: grid; gap: 8px; }
.line { display: grid; grid-template-columns: 1fr 64px 110px 32px; gap: 6px; align-items: start; }
.line .in { height: 38px; font-size: 13px; padding: 0 10px; }
.line textarea.in { min-height: 38px; height: 38px; padding: 8px 10px; resize: vertical; }
.line-h { display: grid; grid-template-columns: 1fr 64px 110px 32px; gap: 6px; font-size: 11px; font-weight: 600; color: var(--muted); }
.totals-mini { display: grid; gap: 4px; padding: 12px 14px; border-radius: 12px; background: var(--bg-2); font-size: 13px; }
.totals-mini div { display: flex; justify-content: space-between; }
.totals-mini .tt { font: 700 16px var(--font-display); }

/* the paper (document) */
.paper { --pc: #FF5A1F; background: #fff; color: #111; width: 100%; max-width: 794px; margin: 0 auto; padding: 48px 52px; font: 12px/1.55 var(--font-body); box-shadow: 0 10px 40px rgba(0,0,0,.12); border-radius: 4px; position: relative; overflow: hidden; }
.paper::before { content: ''; position: absolute; left: 0; top: 0; right: 0; height: 6px; background: var(--pc); }
.pp-top { display: flex; justify-content: space-between; gap: 24px; align-items: flex-start; }
.pp-logo { max-height: 56px; max-width: 180px; object-fit: contain; }
.pp-brand { font: 800 20px var(--font-display); letter-spacing: -.02em; }
.pp-me { color: #555; font-size: 11px; margin-top: 6px; white-space: pre-line; }
.pp-kind { text-align: right; }
.pp-kind h1 { margin: 0; font: 800 30px/1 var(--font-display); letter-spacing: -.03em; text-transform: uppercase; color: var(--pc); }
.pp-kind .no { font-weight: 600; margin-top: 6px; }
.pp-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin: 32px 0 24px; }
.pp-lbl { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #888; margin-bottom: 6px; }
.pp-client { font-weight: 700; font-size: 14px; }
.pp-dates { display: grid; grid-template-columns: auto auto; gap: 2px 16px; justify-content: end; text-align: right; }
.pp-dates span:nth-child(odd) { color: #888; }
.pp-obj { padding: 10px 14px; background: #F6F6F4; border-radius: 8px; margin-bottom: 18px; }

/* ---------- money ---------- */
const money = (n, opts = {}) => {
  const c = CUR[S.settings.currency] || CUR.XOF;
  const v = new Intl.NumberFormat('fr-FR', { minimumFractionDigits: opts.compact ? 0 : c.d, maximumFractionDigits: opts.compact ? 0 : c.d }).format(Math.round(n * 100) / 100).replace(/ /g, ' ');
  return c.s === '€' || c.s === 'FCFA' ? `${v} ${c.s}` : `${c.s}${v}`;
};
const compact = n => {
  const a = Math.abs(n), c = CUR[S.settings.currency] || CUR.XOF;
  if (a >= 1e6) return (n / 1e6).toFixed(a >= 1e7 ? 0 : 1).replace('.', ',') + ' M';
  if (a >= 1e3) return Math.round(n / 1e3) + ' k';
  return String(Math.round(n));
};

/* number to French words (for "Arrêté la présente facture à la somme de…") */
function frWords(n) {
  n = Math.floor(Math.abs(n));
  if (n === 0) return 'zéro';
  const u = ['', 'un', 'deux', 'trois', 'quatre', 'cinq', 'six', 'sept', 'huit', 'neuf', 'dix', 'onze', 'douze', 'treize', 'quatorze', 'quinze', 'seize'];
  const t = ['', 'dix', 'vingt', 'trente', 'quarante', 'cinquante', 'soixante'];
  const lt100 = x => {
    if (x < 17) return u[x];
    if (x < 20) return 'dix-' + u[x - 10];
    if (x < 70) { const d = Math.floor(x / 10), r = x % 10; return t[d] + (r === 1 ? '-et-un' : r ? '-' + u[r] : ''); }
    if (x < 80) return 'soixante' + (x === 71 ? '-et-onze' : '-' + lt100(x - 60));
    const r = x - 80; return 'quatre-vingt' + (r === 0 ? 's' : '-' + lt100(r));
  };
  const lt1000 = x => {
    const h = Math.floor(x / 100), r = x % 100;
    let s = h === 0 ? '' : h === 1 ? 'cent' : u[h] + '-cent' + (r === 0 ? 's' : '');
    if (r) s += (s ? '-' : '') + lt100(r);
    return s;
  };
  const parts = [];
  const bil = Math.floor(n / 1e9), mil = Math.floor(n / 1e6) % 1000, th = Math.floor(n / 1e3) % 1000, rest = n % 1000;
  if (bil) parts.push(lt1000(bil) + '-milliard' + (bil > 1 ? 's' : ''));
  if (mil) parts.push(lt1000(mil) + '-million' + (mil > 1 ? 's' : ''));
  if (th) parts.push(th === 1 ? 'mille' : lt1000(th).replace(/cents$/, 'cent') + '-mille');
  if (rest) parts.push(lt1000(rest));
  return parts.join('-');
}

/* ---------- lookups & business logic ---------- */
const client = id => S.clients.find(c => c.id === id);
const project = id => S.projects.find(p => p.id === id);
const doc = id => S.docs.find(d => d.id === id);
const cName = id => { const c = client(id); return c ? (c.company || c.name) : 'Sans client'; };
const pstat = k => PSTAT.find(s => s.k === k) || PSTAT[0];

function totals(d) {
  const sub = d.lines.reduce((a, l) => a + num(l.qty) * num(l.price), 0);
  const disc = sub * num(d.discount) / 100;
  const base = sub - disc;
  const tax = d.taxOn ? base * num(d.taxRate) / 100 : 0;
  const total = base + tax;
  const paid = (d.payments || []).reduce((a, p) => a + num(p.amount), 0);
  const deposit = total * num(d.deposit) / 100;
  return { sub, disc, base, tax, total, paid, due: Math.max(0, total - paid), deposit };
}
function docState(d) {
  const t = totals(d);
  if (d.kind === 'facture') {
    if (d.status === 'brouillon') return { k: 'brouillon', l: 'Brouillon', c: '' };
    if (t.total > 0 && t.paid >= t.total - 0.5) return { k: 'paye', l: 'Payée', c: 'b-ok' };
    if (d.dueDate && d.dueDate < today()) return { k: 'retard', l: `En retard · ${daysBetween(d.dueDate, today())} j`, c: 'b-bad' };
    if (t.paid > 0) return { k: 'partiel', l: 'Partiellement payée', c: 'b-warn' };
    return { k: 'envoye', l: 'Envoyée', c: 'b-info' };
  }
  const map = { brouillon: ['Brouillon', ''], envoye: ['Envoyé', 'b-info'], accepte: ['Accepté', 'b-ok'], refuse: ['Refusé', 'b-bad'], converti: ['Converti', 'b-acc'] };
  if (d.status === 'envoye' && d.dueDate && d.dueDate < today()) return { k: 'expire', l: 'Expiré', c: 'b-warn' };
  const m = map[d.status] || map.brouillon;
  return { k: d.status, l: m[0], c: m[1] };
}
const openInvoices = () => S.docs.filter(d => d.kind === 'facture' && d.status !== 'brouillon' && totals(d).due > 0.5);
const isOverdue = d => d.dueDate && d.dueDate < today();

function allIncomes() {
  const out = [];
  S.docs.filter(d => d.kind === 'facture').forEach(d => (d.payments || []).forEach(p => out.push({ id: p.id, date: p.date, amount: num(p.amount), method: p.method, label: `${d.number} · ${cName(d.clientId)}`, docId: d.id, clientId: d.clientId, projectId: d.projectId, source: 'freelance' })));
  S.incomes.forEach(i => out.push({ ...i, amount: num(i.amount), free: true, source: SOURCES[i.source] ? i.source : 'autre', label: i.label || 'Entrée' }));
  return out.sort((a, b) => b.date.localeCompare(a.date));
}
const sumBy = (list, f) => list.filter(f).reduce((a, x) => a + num(x.amount), 0);
function monthsBack(n) { const out = [], d = new Date(today() + 'T00:00:00'); d.setDate(1); for (let i = n - 1; i >= 0; i--) { const x = new Date(d); x.setMonth(d.getMonth() - i); out.push(iso(x).slice(0, 7)); } return out; }
function nextNumber(kind) {
  const y = new Date().getFullYear(), k = `${kind}-${y}`;
  S.settings.counters[k] = (S.settings.counters[k] || 0) + 1;
  return `${S.settings.prefix[kind] || kind.toUpperCase()}-${y}-${String(S.settings.counters[k]).padStart(3, '0')}`;
}
function newDoc(kind, extra = {}) {
  const st = S.settings, d = {
    id: uid(), kind, number: nextNumber(kind), clientId: '', projectId: '', subject: '',
    date: today(), dueDate: addDays(today(), kind === 'facture' ? num(st.payDays) : num(st.quoteDays)),
    lines: [{ id: uid(), desc: '', qty: 1, price: 0 }], discount: 0, taxOn: !!st.taxOn, taxRate: num(st.taxRate),
    deposit: kind === 'facture' ? 0 : num(st.depositPct), notes: '', terms: st.terms, status: 'brouillon', payments: [], createdAt: Date.now(), ...extra,
  };
  S.docs.push(d); save(); return d;
}
function convert(src, kind) {
  const d = newDoc(kind, {
    clientId: src.clientId, projectId: src.projectId, subject: src.subject, lines: src.lines.map(l => ({ ...l, id: uid() })),
    discount: src.discount, taxOn: src.taxOn, taxRate: src.taxRate, deposit: kind === 'facture' ? src.deposit : src.deposit, notes: src.notes, terms: src.terms, fromId: src.id,
  });
  if (src.kind === 'devis') src.status = 'accepte';
  else if (src.kind === 'proforma') src.status = 'converti';
  const p = project(src.projectId);
  if (p && ['prospect', 'devis'].includes(p.status)) p.status = 'en_cours';
  save(); return d;
}
/* recurring expenses: create the monthly copies up to now */
function ensureRecurring() {
  const t = today();
  [S.expenses, S.incomes].forEach(list => list.filter(e => e.recurring && !e.recurOf && /^\d{4}-\d{2}-\d{2}$/.test(e.date || '')).forEach(e => {
    const day = +e.date.slice(8, 10); let y = +e.date.slice(0, 4), m = +e.date.slice(5, 7);
    for (let i = 0; i < 120; i++) {
      m++; if (m > 12) { m = 1; y++; }
      const date = `${y}-${pad(m)}-${pad(Math.min(day, new Date(y, m, 0).getDate()))}`;
      if (date > t) break;
      if (!list.some(x => x.recurOf === e.id && monthKey(x.date) === date.slice(0, 7))) list.push({ ...e, id: uid(), date, recurring: false, recurOf: e.id, receipt: '' });
    }
  }));
}

};
function relDate(s) {
  const d = daysBetween(today(), s);
  if (d === 0) return "Aujourd'hui"; if (d === 1) return 'Demain'; if (d === -1) return 'Hier';
  if (d < 0) return `Il y a ${-d} j`; if (d < 7) return `Dans ${d} j`; return fdate(s).replace(/ \d{4}$/, '');
}
function barChart(series) {
  const W = innerWidth < 600 ? 360 : 640, H = innerWidth < 600 ? 220 : 240, pl = 44, pb = 26, pt = 10;
  const max = Math.max(CUR[S.settings.currency].d ? 100 : 100000, ...series.flatMap(s => [s.inc + (s.sal || 0), s.exp]));
  const nice = (() => { const p = Math.pow(10, Math.floor(Math.log10(max))); return Math.ceil(max / p) * p; })();
  const cw = (W - pl) / series.length, bw = Math.min(26, cw / 3.4), h = H - pb - pt;
  const y = v => pt + h - v / nice * h;
  let g = '';
  for (let i = 0; i <= 4; i++) { const val = nice * i / 4; g += `<line class="grid-l" x1="${pl}" x2="${W}" y1="${y(val)}" y2="${y(val)}"/><text x="${pl - 8}" y="${y(val) + 4}" text-anchor="end">${compact(val)}</text>`; }
  series.forEach((s, i) => {
    const cx = pl + cw * i + cw / 2, [yy, mm] = s.m.split('-');
    const sal = s.sal || 0, top = s.inc + sal;
    g += `<g class="col"><title>${MONTHS[+mm - 1]} ${yy} — ${sal ? `Salaire : ${money(sal)} · ` : ''}Freelance & autres : ${money(s.inc)} · Dépenses : ${money(s.exp)}</title><rect x="${pl + cw * i}" y="${pt}" width="${cw}" height="${h}" fill="transparent"/>
      ${sal ? `<rect class="b" x="${cx - bw - 2}" y="${y(sal)}" width="${bw}" height="${Math.max(0, H - pb - y(sal))}" rx="${s.inc ? 0 : 5}" fill="var(--sal)"/>` : ''}
      ${s.inc ? `<rect class="b" x="${cx - bw - 2}" y="${y(top)}" width="${bw}" height="${Math.max(0, y(sal) - y(top))}" rx="5" fill="var(--inc)"/>` : ''}
      <rect class="b" x="${cx + 2}" y="${y(s.exp)}" width="${bw}" height="${Math.max(0, H - pb - y(s.exp))}" rx="5" fill="var(--exp)"/>
      <text x="${cx}" y="${H - 6}" text-anchor="middle">${MONTHS[+mm - 1]}</text></g>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Revenus et dépenses des 6 derniers mois">${g}</svg>`;
}
function projectRow(p) {

const docFile = d => `${d.number} - ${cName(d.clientId)}`.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^\w .-]+/g, "").replace(/\s+/g, " ").trim();
function markSent(d) { if (d.status === 'brouillon') { d.status = 'envoye'; save(); } }
function printDoc(id) {
  const d = doc(id); if (!d) return;

}
async function pdfDoc(id) {
  const d = doc(id); if (!d) return;
  if (!window.html2pdf) { if (IS_PAGE) return toast('Module PDF pas encore chargé : réessaie dans un instant', 'bad'); toast('Module PDF indisponible (connexion ?) : impression à la place', 'bad'); return printDoc(id); }
  const btn = $('[data-act=pdf]'); if (btn) btn.disabled = true;
  toast('Création du PDF…');
  const host = document.createElement('div'); host.className = 'pdf-host'; host.innerHTML = paper(d); document.body.appendChild(host);

    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const blob = await window.html2pdf().set({ margin: 0, image: { type: 'jpeg', quality: 0.95 }, html2canvas: { scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }, pagebreak: { mode: ['css', 'legacy'] } }).from(host.firstElementChild).outputPdf('blob');
    if (await download(docFile(d) + '.pdf', blob, 'application/pdf')) { toast('PDF téléchargé'); markSent(d); }

routes.finances = v => {
  setTitle('Finances');
  const tab = UI.finTab;
  const inc = allIncomes();
  const t = today(), mk = monthKey(t), y = t.slice(0, 4);
  const incY = inc.filter(i => i.date.startsWith(y)).reduce((a, i) => a + i.amount, 0);
  const expY = S.expenses.filter(e => e.date.startsWith(y)).reduce((a, e) => a + num(e.amount), 0);
  const open = openInvoices();
  const pend = open.reduce((a, d) => a + totals(d).due, 0);
  let body = '';
  if (tab === 'bilan') {
    const years = [...new Set([y, ...inc.map(i => i.date.slice(0, 4)), ...S.expenses.map(e => (e.date || '').slice(0, 4))])].filter(Boolean).sort().reverse();
    const Y = years.includes(UI.year) ? UI.year : y;
    const inY = inc.filter(i => i.date.startsWith(Y)), exY = S.expenses.filter(e => (e.date || '').startsWith(Y));
    const tot = { sal: sumBy(inY, i => i.source === 'salaire'), fl: sumBy(inY, i => i.source === 'freelance'), au: sumBy(inY, i => i.source === 'autre'), exp: sumBy(exY, () => true) };
    const all = tot.sal + tot.fl + tot.au, net = all - tot.exp;
    const lastM = Y === y ? +t.slice(5, 7) : 12;
    let rows = Array.from({ length: lastM }, (_, k) => { const m = `${Y}-${pad(k + 1)}`, r = { m, sal: sumBy(inY, i => monthKey(i.date) === m && i.source === 'salaire'), fl: sumBy(inY, i => monthKey(i.date) === m && i.source === 'freelance'), au: sumBy(inY, i => monthKey(i.date) === m && i.source === 'autre'), exp: sumBy(exY, e => monthKey(e.date) === m) }; r.tot = r.sal + r.fl + r.au; r.net = r.tot - r.exp; return r; });
    const firstUsed = rows.findIndex(r => r.tot || r.exp); rows = firstUsed < 0 ? [] : rows.slice(firstUsed).reverse();
    const byClient = {}; inY.filter(i => i.source === 'freelance').forEach(i => { const k = cName(i.clientId); byClient[k] = (byClient[k] || 0) + i.amount; });
    const cl = Object.entries(byClient).sort((a, b) => b[1] - a[1]).slice(0, 6), maxCl = Math.max(1, ...cl.map(c => c[1]));
    const pct = v => all ? Math.round(v / all * 100) : 0;
    body = `<div class="row" style="margin-bottom:14px"><span class="muted small">Année</span><select class="in" id="fin-year" style="width:auto;height:36px">${years.map(x => opt(x, x, Y)).join('')}</select><span class="spacer"></span><button class="btn sm" data-act="new-salary">${ic('plus')}Salaire</button><button class="btn sm" data-act="new-income">${ic('plus')}Autre revenu</button></div>
    <div class="kpis k4">
      <div class="card kpi hero"><div class="lbl">Revenus totaux ${Y}</div><div class="val">${money(all)}</div><div class="sub">${lastM ? `≈ ${money(all / lastM, { compact: 1 })} / mois` : ''}</div></div>
      <div class="card kpi"><div class="lbl"><span class="dot" style="background:var(--sal)"></span>Salaire</div><div class="val">${money(tot.sal)}</div><div class="sub">${pct(tot.sal)} % des revenus</div></div>
      <div class="card kpi"><div class="lbl"><span class="dot" style="background:var(--inc)"></span>Freelance${tot.au ? ' & autres' : ''}</div><div class="val">${money(tot.fl + tot.au)}</div><div class="sub">${pct(tot.fl + tot.au)} % des revenus</div></div>

const readAsDataURL = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });
async function shrinkImage(file, max, q, alpha) {
  const url = await readAsDataURL(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
  const k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
  const ctx = c.getContext('2d');
  if (!alpha) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); }
  ctx.drawImage(img, 0, 0, c.width, c.height);
  return alpha ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', q);
}

/* ---------- data: export / import / csv / demo ---------- */
async function download(name, content, type) {
  const blob = content instanceof Blob ? content : new Blob([content], { type });
  if (DL) {
    try { await DL.save({ filename: name, data: blob }); return true; }
    catch (e) { if (!e || e.code !== 'declined') toast(e && e.code === 'rate_limited' ? 'Un téléchargement est déjà en cours' : 'Téléchargement impossible ici', 'bad'); return false; }
  }
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); return true; }
  catch { toast('Téléchargement bloqué par le navigateur', 'bad'); return false; }
}
function exportCSV() {
  const rows = [['Date', 'Type', 'Libellé', 'Catégorie / Moyen', 'Client', 'Projet', 'Montant']];
  allIncomes().forEach(i => rows.push([i.date, `Revenu (${SOURCES[i.source]})`, i.label, i.method || '', i.clientId ? cName(i.clientId) : '', project(i.projectId)?.name || '', i.amount]));
  S.expenses.forEach(e => rows.push([e.date, 'Dépense', e.label, e.category, '', project(e.projectId)?.name || '', -num(e.amount)]));
  rows.sort((a, b) => a === rows[0] ? -1 : b === rows[0] ? 1 : a[0].localeCompare(b[0]));
  const csv = '﻿' + rows.map(r => r.map(x => `"${String(x).replace(/"/g, '""')}"`).join(';')).join('\n');
  download(`dak-finances-${today()}.csv`, csv, 'text/csv;charset=utf-8').then(ok => ok && toast('Export CSV téléchargé'));
}

const q = $('#q'), qr = $('#q-res');
let qSel = 0;
function searchRender() {
  const s = q.value.trim().toLowerCase();
  if (!s) { qr.classList.remove('on'); return; }
  const res = [];
  S.clients.forEach(c => { if (`${c.name} ${c.company} ${c.email} ${c.phone}`.toLowerCase().includes(s)) res.push({ h: `#client-${c.id}`, i: 'users', t: c.company || c.name, k: 'Client' }); });
  S.projects.forEach(p => { if (`${p.name} ${p.type} ${cName(p.clientId)}`.toLowerCase().includes(s)) res.push({ h: `#projet-${p.id}`, i: 'folder', t: p.name, k: 'Projet' }); });
  S.docs.forEach(d => { if (`${d.number} ${d.subject} ${cName(d.clientId)}`.toLowerCase().includes(s)) res.push({ h: `#document-${d.id}`, i: 'file', t: `${d.number} · ${cName(d.clientId)}`, k: KSHORT[d.kind] }); });
  qSel = 0;
  qr.innerHTML = res.length ? res.slice(0, 10).map((r, i) => `<a href="${r.h}" class="${i === 0 ? 'sel' : ''}">${ic(r.i)}<span>${esc(r.t)}</span><small>${r.k}</small></a>`).join('') : '<div class="muted" style="padding:10px">Aucun résultat</div>';
  qr.classList.add('on');
}
q.addEventListener('input', searchRender);
q.addEventListener('focus', searchRender);
q.addEventListener('keydown', e => {
  const items = $$('a', qr);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (!items.length) return; items[qSel]?.classList.remove('sel'); qSel = (qSel + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length; items[qSel].classList.add('sel'); }
  if (e.key === 'Enter' && items[qSel]) { e.preventDefault(); go(items[qSel].getAttribute('href')); q.value = ''; qr.classList.remove('on'); q.blur(); }
  if (e.key === 'Escape') { q.value = ''; qr.classList.remove('on'); q.blur(); }
});
qr.addEventListener('click', e => { if (e.target.closest('a')) { q.value = ''; qr.classList.remove('on'); } });
document.addEventListener('click', e => { if (!e.target.closest('.search')) qr.classList.remove('on'); });
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); q.focus(); q.select(); }
  else if (e.key.toLowerCase() === 'n' && !e.metaKey && !e.ctrlKey && !e.altKey && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && !$('#modal').open) { e.preventDefault(); quickNew(); }
});

/* ---------- boot ---------- */
async function boot() {
  applyTheme(); setSync();
  if (window.claude && typeof window.claude.use === 'function') {
    $('#view').innerHTML = `<div class="empty"><div class="em-ic">${ic('clock', 'width:24px;height:24px')}</div><h4>Chargement de tes données…</h4></div>`;
    try {
      const [db, user, dl] = await Promise.all([window.claude.use('db'), window.claude.use('user'), window.claude.use('downloads').catch(() => null)]);
      DL = dl;
      const uidv = user ? await user.id() : null;
      if (db && uidv) {
        const col = db.collection('data/users/' + uidv);
        const snap = await Promise.race([col.get(), new Promise((_, rej) => setTimeout(() => rej({ code: 'timeout' }), 15000))]);
        const docs = snap.docs.filter(x => x.exists).map(x => [x.id, JSON.parse(JSON.stringify(x.data()))]);
        CLOUD = col; MODE = 'cloud';
        docs.forEach(([k, b]) => { lastDocs[k] = JSON.stringify(b); });
        if (docs.length) S = fromDocs(docs);
        else { const raw = lsGet(KEY); if (raw) { try { S = normalize(JSON.parse(raw)); } catch { /* ignore */ } } }
      }
    } catch (e) { console.warn('Compte indisponible, enregistrement local', e); }
  }
  if (MODE !== 'cloud') {
    MODE = LS ? 'local' : 'memory';
    const raw = lsGet(KEY);
    if (raw) { try { S = normalize(JSON.parse(raw)); } catch { /* ignore */ } }
  }
  ensureRecurring(); save();
  applyTheme(); route();
}
boot();
</script>
